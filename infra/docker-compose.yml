version: "3.3"

services:
  gateway:
    image: nginx:latest
    restart: always
    container_name: global-nginx
    ports:
      - "443:80"
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./global.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/certs
      - ./site:/usr/share/nginx/html:ro
    networks:
      - bridge-net

networks:
  bridge-net:
    driver: bridge
