version: '3.3'

services:
  gateway:
    image: nginx:latest
    restart: always
    container_name: global-nginx
    ports:
      - "443:80"
      - "80:80"
    volumes:
      - ./global.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/certs
      - ./404.html:/usr/share/nginx/html/404.html
      - ./index.html:/usr/share/nginx/html/index.html
    networks:
      - bridge-net

networks:
  bridge-net:
    driver: bridge
